    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p>&nbsp;</p><p><iframe width="894" height="503" src="https://www.youtube.com/embed/jlMvRvHUfbQ" title="Market uncertainty and your super: A conversation with CareSuper." frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe></p><h3 style="-webkit-font-smoothing:antialiased;-webkit-text-stroke-width:0px;border-width:0px;box-sizing:inherit;color:rgb(0, 15, 105);font-family:filson-pro, sans-serif;font-size:32px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;line-height:1.2;margin:0px 0px 8px;orphans:2;outline:0px;padding:0px;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;" data-uw-rm-heading="prs" id="you'll-hear-about:"><strong>You'll hear about:</strong></h3><p style="margin-left:3rem;"><span style="border-width:0px;box-sizing:inherit;font-family:inherit;font-size:1rem;font-style:inherit;font-weight:inherit;margin:0px;outline:0px;padding:0px;vertical-align:baseline;">How headlines can move markets, and why it helps to focus on </span><strong style="-webkit-font-smoothing:antialiased;border-width:0px;box-sizing:inherit;font-family:inherit;font-size:1rem;font-style:inherit;margin:0px;outline:0px;padding:0px;vertical-align:baseline;">long term outcomes</strong><span style="border-width:0px;box-sizing:inherit;font-family:inherit;font-size:1rem;font-style:inherit;font-weight:inherit;margin:0px;outline:0px;padding:0px;vertical-align:baseline;"> rather than day to day noise.&nbsp;</span></p><p style="margin-left:3rem;">CareSuper’s <strong style="-webkit-font-smoothing:antialiased;border-width:0px;box-sizing:inherit;font-family:inherit;font-size:16px;font-style:inherit;margin:0px;outline:0px;padding:0px;vertical-align:baseline;">“smooth ride” investment approach</strong> that’s designed for resilience through changing conditions.</p><p style="margin-left:3rem;">The role of <strong style="-webkit-font-smoothing:antialiased;border-width:0px;box-sizing:inherit;font-family:inherit;font-size:16px;font-style:inherit;margin:0px;outline:0px;padding:0px;vertical-align:baseline;">diversification and downside protection</strong> in helping manage uncertainty.&nbsp;</p><p style="margin-left:3rem;">Common mistakes people make when markets feel uncertain including trying to <strong style="-webkit-font-smoothing:antialiased;border-width:0px;box-sizing:inherit;font-family:inherit;font-size:16px;font-style:inherit;margin:0px;outline:0px;padding:0px;vertical-align:baseline;">time the market,</strong> or switching to cash in a rush.&nbsp;</p><p style="margin-left:3rem;">What to think about if you’re feeling unsure and you’re either <strong style="-webkit-font-smoothing:antialiased;border-width:0px;box-sizing:inherit;font-family:inherit;font-size:16px;font-style:inherit;margin:0px;outline:0px;padding:0px;vertical-align:baseline;">close to retirement, or already drawing an income.</strong></p><p style="margin-left:3rem;">&nbsp;</p><p style="margin-left:3rem;">&nbsp;</p><h3 style="-webkit-font-smoothing:antialiased;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:inherit;color:rgb(0, 15, 105);font-family:filson-pro, sans-serif;font-size:32px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;line-height:1.2;margin:0px 0px 8px;orphans:2;outline:0px;padding:0px;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;" data-uw-rm-heading="prs" id="need-help-deciding-what-to-do-next?"><strong>Need help deciding what to do next?</strong></h3><p style="-webkit-font-smoothing:antialiased;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:inherit;color:rgb(48, 48, 48);font-family:filson-pro, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:-0.32px;line-height:1.6;margin:0px 0px 0.5rem;orphans:2;outline:0px;padding:0px;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">We can help you understand your investment options and the choices available, especially if you’re close to retirement, already retired, or considering a change to your investments.</p><p style="-webkit-font-smoothing:antialiased;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:inherit;color:rgb(48, 48, 48);font-family:filson-pro, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:-0.32px;line-height:1.6;margin:0px 0px 0.5rem;orphans:2;outline:0px;padding:0px;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">You can:</p><p style="margin-left:3rem;">Call us for general help and support <a style="-webkit-font-smoothing:antialiased;background-color:transparent;border-width:0px;box-sizing:inherit;color:rgb(41, 79, 237);font-family:inherit;font-size:16px;font-style:inherit;letter-spacing:-0.32px;line-height:1.6;margin:0px;outline:0px;padding:0px;text-underline-position:from-font;vertical-align:baseline;" href="tel:1800005166" target="_blank" rel="noopener noreferrer" aria-label="call 1800005166" uw-rm-vague-link-id="tel:1800005166$call 1800005166" title="1800 005 166"><strong style="-webkit-font-smoothing:antialiased;border-width:0px;box-sizing:inherit;font-family:inherit;font-size:16px;font-style:inherit;margin:0px;outline:0px;padding:0px;vertical-align:baseline;"><u>1800 005 166</u></strong></a> or go to our website to use our webchat</p><p style="margin-left:3rem;"><a style="-webkit-font-smoothing:antialiased;background-color:transparent;border-width:0px;box-sizing:inherit;color:rgb(41, 79, 237);font-family:inherit;font-size:16px;font-style:inherit;letter-spacing:-0.32px;line-height:1.6;margin:0px;outline:0px;padding:0px;text-underline-position:from-font;vertical-align:baseline;" href="https://www.caresuper.com.au/members/contact-us" data-uw-rm-brl="PR" data-uw-original-href="/sitecore/service/notfound.aspx?item=web%3a%7bF326944D-EDC6-4BBA-B6AC-531C16379D4A%7d%40en"><strong><u>Request a call</u></strong></a> with a Superannuation Adviser to talk through your personal circumstances and goals</p><p style="margin-left:3rem;">Keep learning with <a style="-webkit-font-smoothing:antialiased;background-color:transparent;border-width:0px;box-sizing:inherit;color:rgb(41, 79, 237);font-family:inherit;font-size:16px;font-style:inherit;letter-spacing:-0.32px;line-height:1.6;margin:0px;outline:0px;padding:0px;text-underline-position:from-font;vertical-align:baseline;" href="https://www.caresuper.com.au/members/advice-and-resources/events-and-webinars" data-uw-rm-brl="PR" data-uw-original-href="/members/advice-and-resources/events-and-webinars"><strong><u>upcoming webinars</u></strong></a> and practical resources</p><p style="margin-left:3rem;">Learn more about <a style="-webkit-font-smoothing:antialiased;background-color:transparent;border-width:0px;box-sizing:inherit;color:rgb(41, 79, 237);font-family:inherit;font-size:16px;font-style:inherit;letter-spacing:-0.32px;line-height:1.6;margin:0px;outline:0px;padding:0px;text-underline-position:from-font;vertical-align:baseline;" href="https://www.caresuper.com.au/members/investments/investment-options" data-uw-rm-brl="PR" data-uw-original-href="/members/investments/investment-options"><strong><u>investment options</u></strong></a> and making change.</p></div>
